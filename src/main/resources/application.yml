spring:
  application:
    name: fintechnexus

  # Flyway — migrations automáticas no startup
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate        # nunca deixe create ou update em app financeira
    open-in-view: false         # evita lazy loading acidental fora da transaction
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  # Virtual Threads — Java 21
  threads:
    virtual:
      enabled: true

  # RabbitMQ — publisher confirms obrigatório para o Outbox
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# Actuator — expõe o necessário para K8s probes e Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logs — nível padrão
logging:
  level:
    root: INFO
    com.fintechnexus: DEBUG